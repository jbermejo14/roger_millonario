    // MOTOR DE AUDIO SINTÉTICO (WEB AUDIO API)
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.droneOsc = null;
        this.droneGain = null;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }
      setMuted(m) {
        this.muted = m;
        if (m && this.droneGain) {
          this.droneGain.gain.setValueAtTime(0, this.ctx.currentTime);
        }
      }
      startSuspenseDrone() {
        if (this.muted || !this.ctx) return;
        this.stopSuspenseDrone();
        try {
          const now = this.ctx.currentTime;
          this.droneOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          this.droneGain = this.ctx.createGain();

          this.droneOsc.type = "sawtooth";
          this.droneOsc.frequency.setValueAtTime(55, now);
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(140, now);

          this.droneGain.gain.setValueAtTime(0.001, now);
          this.droneGain.gain.exponentialRampToValueAtTime(0.06, now + 1.2);

          this.droneOsc.connect(filter);
          filter.connect(this.droneGain);
          this.droneGain.connect(this.ctx.destination);
          this.droneOsc.start(now);
        } catch(e) {}
      }
      stopSuspenseDrone() {
        if (this.droneOsc && this.ctx) {
          try {
            this.droneGain?.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
            setTimeout(() => {
              try { this.droneOsc?.stop(); this.droneOsc = null; } catch(_) {}
            }, 350);
          } catch(e) { this.droneOsc = null; }
        }
      }
      playTick(urgent = false) {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const freq = urgent ? 880 : 440;
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.08);
          gain.gain.setValueAtTime(urgent ? 0.15 : 0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch(e) {}
      }
      playSelect() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [220, 330].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now + idx * 0.05);
            gain.gain.setValueAtTime(0.12, now + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.05);
            osc.stop(now + idx * 0.05 + 0.3);
          });
        } catch(e) {}
      }
      playLifeline() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.12, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.45);
          });
        } catch(e) {}
      }
      playCorrect() {
        this.stopSuspenseDrone();
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [392.0, 523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.2, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.7);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.75);
          });
        } catch(e) {}
      }
      playWrong() {
        this.stopSuspenseDrone();
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [220, 196, 174].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(freq, now + i * 0.12);
            gain.gain.setValueAtTime(0.2, now + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.6);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.12);
            osc.stop(now + i * 0.12 + 0.65);
          });
        } catch(e) {}
      }
      playThemeReveal() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [261.63, 329.63, 392.0].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.15, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.55);
          });
        } catch(e) {}
      }
    }

    // COMPONENTE DE LA ESCALA DE PREMIOS (LATERAL Y MODAL)
    function PrizeLadderCard({ activeTeamIndex, teams, matchNumber, matchHistory = [], gameState, currentPrizeObj, isModal, onClose }) {
      const activeTeam = teams[activeTeamIndex] || teams[0];
      const otherIndex = activeTeamIndex === 0 ? 1 : 0;
      const otherTeam = teams[otherIndex];

      return (
        <div className="bg-slate-950/95 border border-slate-700/80 rounded-2xl p-4 shadow-2xl backdrop-blur-md w-full">
          {/* Cabecera del Panel */}
          <div className="flex items-center justify-between border-b border-slate-800 pb-2.5 mb-3">
            <div className="flex items-center gap-2">
              <span className="text-amber-400 text-sm">◆</span>
              <span className="text-xs font-black uppercase tracking-widest text-slate-100">
                Escala de Premios
              </span>
            </div>
            {isModal ? (
              <button
                onClick={onClose}
                className="text-slate-300 hover:text-white text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 font-bold border border-slate-700"
              >
                ✕ Cerrar
              </button>
            ) : (
              <span className="text-[10px] font-black uppercase text-amber-400 bg-amber-400/10 border border-amber-400/30 px-2 py-0.5 rounded-full">
                Partida {matchNumber}
              </span>
            )}
          </div>

          {/* Tarjeta: Por dónde van ahora */}
          <div className="mb-3.5 p-3 rounded-xl bg-gradient-to-r from-blue-950/80 to-slate-900 border border-amber-500/40 shadow-inner">
            <div className="text-[10px] font-bold uppercase tracking-wider text-amber-400 flex items-center justify-between">
              <span>En juego ({activeTeam.name}):</span>
              <span className="text-slate-300">Nivel {activeTeam.level} de 15</span>
            </div>
            <div className="text-2xl font-black text-white tracking-wide mt-0.5">
              {currentPrizeObj.label}
            </div>
            {gameState !== "SETUP" && gameState !== "FINISHED" && gameState !== "MATCH_SUMMARY" && (
              <div className="text-xs text-slate-300 mt-1 flex flex-col gap-1">
                <div className="flex items-center gap-1.5">
                  <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  <span>Turno actual:</span>
                  <strong className="text-amber-300">{activeTeam.name}</strong>
                </div>
                {!otherTeam.isAlive && (
                  <div className="text-[10px] text-amber-400/95 font-bold bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/30">
                    ⚠️ {otherTeam.name} eliminado ({otherTeam.money.toLocaleString("es-ES")} €) • En solitario
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Posición económica de cada equipo */}
          <div className="grid grid-cols-2 gap-2 text-xs mb-3.5">
            {teams.map((t, idx) => {
              const isTurn = idx === activeTeamIndex && gameState !== "SETUP" && gameState !== "FINISHED" && gameState !== "MATCH_SUMMARY";
              const isDead = !t.isAlive;
              const borderClass = idx === 0
                ? (isTurn ? "bg-blue-950/90 border-amber-400 ring-2 ring-amber-400/50" : isDead ? "bg-slate-950/80 border-slate-800 opacity-75" : "bg-blue-950/40 border-blue-500/30")
                : (isTurn ? "bg-purple-950/90 border-amber-400 ring-2 ring-amber-400/50" : isDead ? "bg-slate-950/80 border-slate-800 opacity-75" : "bg-purple-950/40 border-purple-500/30");

              return (
                <div key={t.id} className={`p-2 rounded-lg border transition-all ${borderClass}`}>
                  <div className="flex items-center justify-between">
                    <span className={`text-[10px] font-bold truncate ${idx === 0 ? "text-blue-300" : "text-purple-300"}`}>{t.name}</span>
                    <span className={`text-[9px] text-white font-black px-1 rounded ${idx === 0 ? "bg-blue-600" : "bg-purple-600"}`}>
                      {idx === 0 ? "E1" : "E2"}
                    </span>
                  </div>
                  <div className="text-sm font-black text-white mt-0.5">
                    {t.money.toLocaleString("es-ES")} €
                  </div>
                  <div className="text-[9px] text-slate-400">
                    {isDead ? (
                      <span className="text-red-400 font-bold">❌ Eliminado</span>
                    ) : (
                      <span>Nivel {t.level} • Seg: {t.safeMoney.toLocaleString("es-ES")} €</span>
                    )}
                  </div>
                  {matchHistory && matchHistory.length > 0 && (
                    <div className="text-[8px] text-amber-300/80 border-t border-slate-800/80 mt-1 pt-0.5">
                      {(() => {
                        const prev = matchHistory.reduce((acc, m) => acc + (idx === 0 ? m.team0 : m.team1), 0);
                        return `Previo: ${prev.toLocaleString("es-ES")} € | Tot: ${(prev + t.money).toLocaleString("es-ES")} €`;
                      })()}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Lista de los 15 Escalones (de 15 a 1) */}
          <div className="space-y-1">
            {[...PRIZE_LADDER].reverse().map((p) => {
              const isCurrent = p.level === activeTeam.level;
              const isE1Aiming = teams[0].isAlive && teams[0].level === p.level;
              const isE2Aiming = teams[1].isAlive && teams[1].level === p.level;
              const isE1Here = teams[0].money === p.prize && teams[0].money > 0;
              const isE2Here = teams[1].money === p.prize && teams[1].money > 0;

              let rowClasses = "text-amber-400/90 font-semibold hover:bg-slate-900/60";
              let numClass = "text-amber-500/70";
              let labelClass = "text-amber-300";

              if (isCurrent) {
                rowClasses = "bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black shadow-lg shadow-amber-400/30 ring-2 ring-amber-300 scale-[1.02]";
                numClass = "text-slate-950 font-black";
                labelClass = "text-slate-950 font-black";
              } else if (p.isSafe) {
                rowClasses = "text-white font-black bg-blue-950/40 border border-slate-700/60";
                numClass = "text-white font-black";
                labelClass = "text-white font-black";
              }

              return (
                <div
                  key={p.level}
                  className={`flex items-center justify-between py-1 px-2.5 rounded text-xs transition-all ${rowClasses}`}
                >
                  <div className="flex items-center gap-2">
                    <span className={`w-5 text-right font-mono text-[11px] ${numClass}`}>
                      {p.level}
                    </span>
                    <span className={isCurrent ? "text-slate-950 font-black" : p.isSafe ? "text-white" : "text-amber-500"}>
                      ◆
                    </span>
                    <span className={`tracking-wide ${labelClass}`}>
                      {p.label}
                    </span>
                    {p.isSafe && !isCurrent && (
                      <span className="text-[8px] uppercase tracking-wider text-slate-300 font-bold bg-slate-800/80 px-1 py-0.2 rounded border border-slate-700">
                        Seguro
                      </span>
                    )}
                  </div>

                  {/* Indicadores en el escalón */}
                  <div className="flex items-center gap-1">
                    {isCurrent && (
                      <span className="text-[8px] uppercase font-black bg-slate-950 text-amber-300 px-1.5 py-0.5 rounded shadow tracking-wider">
                        En Juego
                      </span>
                    )}
                    {isE1Aiming && !isCurrent && (
                      <span className="text-[8px] font-bold bg-blue-700 text-white px-1 py-0.2 rounded" title={`${teams[0].name} va por este nivel`}>
                        E1
                      </span>
                    )}
                    {isE2Aiming && !isCurrent && (
                      <span className="text-[8px] font-bold bg-purple-700 text-white px-1 py-0.2 rounded" title={`${teams[1].name} va por este nivel`}>
                        E2
                      </span>
                    )}
                    {isE1Here && (
                      <span className="text-[9px] font-black bg-blue-600 text-white px-1.5 py-0.5 rounded shadow ring-1 ring-blue-300" title={`${teams[0].name} tiene este premio`}>
                        E1 €
                      </span>
                    )}
                    {isE2Here && (
                      <span className="text-[9px] font-black bg-purple-600 text-white px-1.5 py-0.5 rounded shadow ring-1 ring-purple-300" title={`${teams[1].name} tiene este premio`}>
                        E2 €
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Leyenda */}
          <div className="mt-3 pt-2.5 border-t border-slate-800 text-[10px] text-slate-400 flex flex-wrap items-center justify-between gap-1">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded-full bg-amber-400"></span> En juego
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded-full bg-white"></span> Seguro
            </span>
            <span className="flex items-center gap-1">
              <span className="px-1 bg-blue-600 text-white rounded text-[8px] font-bold">E1</span> / <span className="px-1 bg-purple-600 text-white rounded text-[8px] font-bold">E2</span> Equipos
            </span>
          </div>
        </div>
      );
    }

    // COMPONENTE PRINCIPAL
    function App() {
      const [muted, setMuted] = useState(false);
      const [teams, setTeams] = useState([
        { id: 0, name: "Equipo 1", level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } },
        { id: 1, name: "Equipo 2", level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } }
      ]);
      const [gameState, setGameState] = useState("SETUP"); // SETUP | THEME_REVEAL | QUESTION | ANSWERED | MATCH_SUMMARY | FINISHED
      
      // TORNEO DE 2 O 3 PARTIDAS:
      const [matchNumber, setMatchNumber] = useState(1);
      const [matchHistory, setMatchHistory] = useState([]); // [{ match: 1, team0: X, team1: Y, team0Level: A, team1Level: B }, ...]
      const [activeTeamIndex, setActiveTeamIndex] = useState(0); // 0 (Equipo 1) o 1 (Equipo 2)
      
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [usedQuestionIds, setUsedQuestionIds] = useState([]);
      const usedQuestionIdsRef = useRef(new Set());
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswerConfirmed, setIsAnswerConfirmed] = useState(false);
      const [eliminatedOptions, setEliminatedOptions] = useState([]);
      const [timeLeft, setTimeLeft] = useState(30);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Reproductor de audio de 5 segundos
      const audioPlayerRef = useRef(null);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [audioMode, setAudioMode] = useState("NONE"); // "NONE" | "SNIPPET_5S" | "INFINITE"
      const [audioSecondsLeft, setAudioSecondsLeft] = useState(5);
      const audioCountdownRef = useRef(null);
      const [audioError, setAudioError] = useState(false);

      // Modales y Control
      const [activeModal, setActiveModal] = useState(null); // 'CALL' | 'PUBLIC' | 'HOST' | 'REBUY' | 'QR' | 'LADDER'
      const [lifelineCountdown, setLifelineCountdown] = useState(30);
      const [rebuyType, setRebuyType] = useState(null);
      const [showHostPanel, setShowHostPanel] = useState(false);
      const [copied, setCopied] = useState(false);
      const [localIp, setLocalIp] = useState("192.168.1.70");

      useEffect(() => {
        if (window.location.hostname && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
          setLocalIp(window.location.hostname);
        }
      }, []);

      const publicUrl = "https://jbermejo14.github.io/roger_millonario/";
      const shareUrl = (typeof window !== "undefined" && window.location.href && !window.location.origin.includes("localhost") && !window.location.origin.includes("127.0.0.1"))
        ? window.location.href.split("?")[0].split("#")[0]
        : publicUrl;

      const unlockAudio = () => {
        sound.init();
      };

      const toggleSound = () => {
        const next = !muted;
        setMuted(next);
        sound.setMuted(next);
      };

      // Controlador de audio para preguntas musicales: 5 segundos, infinito y reiniciar
      const initAudioElement = () => {
        if (!audioPlayerRef.current) {
          audioPlayerRef.current = new Audio(currentQuestion.audioSrc);
        } else if (audioPlayerRef.current.src !== new URL(currentQuestion.audioSrc, window.location.href).href) {
          audioPlayerRef.current.src = currentQuestion.audioSrc;
        }
        return audioPlayerRef.current;
      };

      // 1. Fragmento de 5 segundos
      const play5SecondsAudio = () => {
        if (!currentQuestion?.audioSrc) return;
        if (isPlayingAudio && audioMode === "SNIPPET_5S") {
          if (audioPlayerRef.current) audioPlayerRef.current.pause();
          clearInterval(audioCountdownRef.current);
          setIsPlayingAudio(false);
          setAudioMode("NONE");
          setAudioSecondsLeft(5);
          sound.startSuspenseDrone();
          return;
        }

        sound.stopSuspenseDrone();
        clearInterval(audioCountdownRef.current);
        const player = initAudioElement();
        player.currentTime = currentQuestion.audioStart || 0;
        player.play().catch(e => {
          console.warn("Audio error:", e);
          clearInterval(audioCountdownRef.current);
          setIsPlayingAudio(false);
          setAudioMode("NONE");
        });
        setIsPlayingAudio(true);
        setAudioMode("SNIPPET_5S");
        setAudioSecondsLeft(5);

        let left = 5;
        audioCountdownRef.current = setInterval(() => {
          left -= 1;
          setAudioSecondsLeft(left);
          if (left <= 0) {
            clearInterval(audioCountdownRef.current);
            if (audioPlayerRef.current) audioPlayerRef.current.pause();
            setIsPlayingAudio(false);
            setAudioMode("NONE");
            setAudioSecondsLeft(5);
            if (gameState === "QUESTION" && !isAnswerConfirmed) {
              sound.startSuspenseDrone();
            }
          }
        }, 1000);
      };

      // 2. Play / Pausar
      const toggleInfiniteAudio = () => {
        if (!currentQuestion?.audioSrc) return;
        if (isPlayingAudio) {
          if (audioPlayerRef.current) audioPlayerRef.current.pause();
          setIsPlayingAudio(false);
          setAudioMode("NONE");
          sound.startSuspenseDrone();
          return;
        }

        clearInterval(audioCountdownRef.current);
        sound.stopSuspenseDrone();
        setAudioError(false);
        const player = initAudioElement();
        if (player.paused && (player.currentTime < (currentQuestion.audioStart || 0) || player.ended)) {
          player.currentTime = currentQuestion.audioStart || 0;
        }
        player.play().catch(e => {
          console.warn("Audio error:", e);
          setIsPlayingAudio(false);
          setAudioMode("NONE");
          setAudioError(true);
        });
        setIsPlayingAudio(true);
        setAudioMode("INFINITE");
        setAudioSecondsLeft(5);
      };

      // 3. Reiniciar canción desde el inicio del fragmento
      const restartAudio = () => {
        if (!currentQuestion?.audioSrc) return;
        sound.stopSuspenseDrone();
        clearInterval(audioCountdownRef.current);
        setAudioError(false);
        const player = initAudioElement();
        player.currentTime = currentQuestion.audioStart || 0;
        player.play().catch(e => {
          console.warn("Audio error:", e);
          setIsPlayingAudio(false);
          setAudioMode("NONE");
          setAudioError(true);
        });
        setIsPlayingAudio(true);
        setAudioMode("INFINITE");
      };

      useEffect(() => {
        if (audioPlayerRef.current) {
          audioPlayerRef.current.pause();
        }
        clearInterval(audioCountdownRef.current);
        setIsPlayingAudio(false);
        setAudioMode("NONE");
        setAudioSecondsLeft(5);
        setAudioError(false);
      }, [currentQuestion]);

      // Tramos de dificultad para garantizar variedad sin repetición
    const TIER_MAPPING = {
      1: [1, 2, 3], 2: [1, 2, 3], 3: [1, 2, 3],       // Muy fáciles (13 preguntas)
      4: [4, 5, 6], 5: [4, 5, 6], 6: [4, 5, 6],       // Fáciles (16 preguntas)
      7: [7, 8, 9], 8: [7, 8, 9], 9: [7, 8, 9],       // Medias (16 preguntas)
      10: [10, 11, 12], 11: [10, 11, 12], 12: [10, 11, 12], // Difíciles (13 preguntas)
      13: [13, 14, 15], 14: [13, 14, 15], 15: [13, 14, 15]  // Muy difíciles (15 preguntas)
    };

    // Seleccionar pregunta asegurando CERO repeticiones en toda la partida y torneo
    const pickQuestionForTeam = (teamIndex, customLevel = null) => {
      const team = teams[teamIndex];
      const level = customLevel !== null ? customLevel : (team?.level || 1);
      let chosen = null;

      // 1. Pregunta musical de Titanium para nivel 2 (solo 1 vez en todo el concurso)
      if (level === 2 && !usedQuestionIdsRef.current.has(155)) {
        const tit = QUESTIONS_DB.find(q => q.id === 155);
        if (tit) chosen = tit;
      }
      // 2. Pregunta de imagen Honda para nivel 3 (solo 1 vez en todo el concurso)
      else if (level === 3 && !usedQuestionIdsRef.current.has(300)) {
        const hon = QUESTIONS_DB.find(q => q.id === 300);
        if (hon) chosen = hon;
      }

      // 3. Buscar preguntas NO usadas del nivel exacto
      if (!chosen) {
        const exactAvailable = QUESTIONS_DB.filter(q => 
          q.level === level && 
          !usedQuestionIdsRef.current.has(q.id) &&
          q.id !== 155 && q.id !== 300
        );

        if (exactAvailable.length > 0) {
          chosen = exactAvailable[Math.floor(Math.random() * exactAvailable.length)];
        } else {
          // 4. Si el nivel exacto se agotó: buscar en el mismo tramo de dificultad (evita repetir)
          const tierLevels = TIER_MAPPING[level] || [level];
          const tierAvailable = QUESTIONS_DB.filter(q => 
            tierLevels.includes(q.level) && 
            !usedQuestionIdsRef.current.has(q.id) &&
            q.id !== 155 && q.id !== 300
          );

          if (tierAvailable.length > 0) {
            chosen = tierAvailable[Math.floor(Math.random() * tierAvailable.length)];
          } else {
            // 5. Último recurso si se juegan muchísimas partidas sin reset
            const anyUnused = QUESTIONS_DB.filter(q => !usedQuestionIdsRef.current.has(q.id));
            if (anyUnused.length > 0) {
              chosen = anyUnused[Math.floor(Math.random() * anyUnused.length)];
            } else {
              usedQuestionIdsRef.current.clear();
              chosen = QUESTIONS_DB[Math.floor(Math.random() * QUESTIONS_DB.length)];
            }
          }
        }
      }

      // Registro síncrono e inmediato en el Set
      usedQuestionIdsRef.current.add(chosen.id);
      setUsedQuestionIds(Array.from(usedQuestionIdsRef.current));

      setCurrentQuestion(chosen);
      setSelectedOption(null);
      setIsAnswerConfirmed(false);
      setEliminatedOptions([]);
      setTimeLeft(30);
      setIsTimerRunning(false);
    };

      const handleStartGame = () => {
        unlockAudio();
        setMatchNumber(1);
        setMatchHistory([]);
        usedQuestionIdsRef.current.clear();
        setUsedQuestionIds([]);
        const initialTeams = [
          { ...teams[0], level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } },
          { ...teams[1], level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } }
        ];
        setTeams(initialTeams);
        setActiveTeamIndex(0);
        pickQuestionForTeam(0, 1);
        setGameState("THEME_REVEAL");
        sound.playThemeReveal();
      };

      const handleStartNextMatch = () => {
        unlockAudio();
        const nextNum = matchNumber + 1;
        setMatchNumber(nextNum);
        const resetTeams = [
          { ...teams[0], level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } },
          { ...teams[1], level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } }
        ];
        setTeams(resetTeams);
        setActiveTeamIndex(0);
        pickQuestionForTeam(0, 1);
        setGameState("THEME_REVEAL");
        sound.playThemeReveal();
      };

      const handleFinishTournament = () => {
        unlockAudio();
        setGameState("FINISHED");
        sound.playCorrect();
      };

      const handleEarlyEndMatch = () => {
        const ok = window.confirm("¿Deseas terminar la partida actual y proclamar al ganador con los resultados acumulados?");
        if (!ok) return;
        sound.stopSuspenseDrone();
        setIsTimerRunning(false);
        setIsAnswerConfirmed(false);
        const currentMatchResult = {
          match: matchNumber,
          team0: teams[0].money,
          team1: teams[1].money,
          team0Level: teams[0].level,
          team1Level: teams[1].level
        };
        setMatchHistory(prev => [...prev, currentMatchResult]);
        setGameState("FINISHED");
        sound.playCorrect();
      };

      const handleResetTournament = () => {
        setMatchNumber(1);
        setMatchHistory([]);
        usedQuestionIdsRef.current.clear();
        setUsedQuestionIds([]);
        setTeams([
          { id: 0, name: teams[0].name || "Equipo 1", level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } },
          { id: 1, name: teams[1].name || "Equipo 2", level: 1, money: 0, safeMoney: 0, isAlive: true, status: "PLAYING", lifelines: { fifty: true, call: true, call2: true, public: true } }
        ]);
        setGameState("SETUP");
      };

      const handleStartQuestionAfterTheme = () => {
        unlockAudio();
        setGameState("QUESTION");
        setTimeLeft(30);
        setIsTimerRunning(true);
        sound.startSuspenseDrone();
      };

      // Temporizador de 30s
      useEffect(() => {
        let timer = null;
        if (gameState === "QUESTION" && isTimerRunning && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                handleTimeOut();
                return 0;
              }
              sound.playTick(prev <= 10);
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [gameState, isTimerRunning, timeLeft]);

      const handleTimeOut = () => {
        sound.stopSuspenseDrone();
        if (audioPlayerRef.current) audioPlayerRef.current.pause();
        clearInterval(audioCountdownRef.current);
        setIsPlayingAudio(false);
        setAudioMode("NONE");
        sound.playWrong();
        setIsTimerRunning(false);
        setIsAnswerConfirmed(true);
        setGameState("ANSWERED");

        setTeams(prev => prev.map((t, idx) => idx === activeTeamIndex ? {
          ...t,
          money: t.safeMoney,
          isAlive: false,
          status: "ELIMINATED"
        } : t));
      };

      const handleSelectOption = (idx) => {
        if (gameState !== "QUESTION" || isAnswerConfirmed || eliminatedOptions.includes(idx)) return;
        setSelectedOption(idx);
        sound.playSelect();
      };

      const handleWalkAway = () => {
        if (gameState !== "QUESTION" || isAnswerConfirmed || timeLeft <= 0) return;
        const currentTeam = teams[activeTeamIndex];
        if (currentTeam.money <= 0) return;

        const ok = window.confirm(`¿${currentTeam.name}, queréis plantaros definitivamente con ${currentTeam.money.toLocaleString("es-ES")} €?`);
        if (!ok) return;

        sound.stopSuspenseDrone();
        if (audioPlayerRef.current) audioPlayerRef.current.pause();
        clearInterval(audioCountdownRef.current);
        setIsPlayingAudio(false);
        setAudioMode("NONE");
        sound.playCorrect();
        setIsTimerRunning(false);
        setIsAnswerConfirmed(true);

        setTeams(prev => prev.map((team, idx) => {
          if (idx === activeTeamIndex) {
            return {
              ...team,
              isAlive: false,
              status: "WALKED_AWAY"
            };
          }
          return team;
        }));

        setGameState("ANSWERED");
      };

      const handleConfirmAnswer = () => {
        if (selectedOption === null || gameState !== "QUESTION") return;
        setIsAnswerConfirmed(true);
        setIsTimerRunning(false);
        if (audioPlayerRef.current) audioPlayerRef.current.pause();
        clearInterval(audioCountdownRef.current);
        setIsPlayingAudio(false);
        setAudioMode("NONE");

        const isCorrect = selectedOption === currentQuestion.correct;
        const activeTeam = teams[activeTeamIndex];
        const prizeInfo = PRIZE_LADDER.find(p => p.level === activeTeam.level);
        const questionPrize = prizeInfo ? prizeInfo.prize : 100;
        const isSafe = prizeInfo ? prizeInfo.isSafe : false;

        setTimeout(() => {
          if (isCorrect) {
            sound.playCorrect();
            setTeams(prev => prev.map((team, idx) => {
              if (idx === activeTeamIndex) {
                const isFinal = team.level >= 15;
                return {
                  ...team,
                  money: questionPrize,
                  safeMoney: isSafe ? questionPrize : team.safeMoney,
                  level: isFinal ? 15 : team.level + 1,
                  isAlive: !isFinal,
                  status: isFinal ? "WON_MILLION" : "PLAYING",
                };
              }
              return team;
            }));
          } else {
            sound.playWrong();
            setTeams(prev => prev.map((team, idx) => {
              if (idx === activeTeamIndex) {
                return {
                  ...team,
                  money: team.safeMoney,
                  isAlive: false,
                  status: "ELIMINATED",
                };
              }
              return team;
            }));
          }
          setGameState("ANSWERED");
        }, 1100);
      };

      // AVANCE DE TURNOS: Alternos si ambos vivos; en solitario si uno pierde; fin si ambos pierden
      const handleNextTurnOrRound = () => {
        const currentTeam = teams[activeTeamIndex];
        const otherIndex = activeTeamIndex === 0 ? 1 : 0;
        const otherTeam = teams[otherIndex];

        // ¿Quién juega a continuación?
        let nextIndex = null;
        if (otherTeam.isAlive && currentTeam.isAlive) {
          nextIndex = otherIndex; // Alternancia normal
        } else if (otherTeam.isAlive && !currentTeam.isAlive) {
          nextIndex = otherIndex; // El actual perdió/terminó, el otro sigue vivo
        } else if (!otherTeam.isAlive && currentTeam.isAlive) {
          nextIndex = activeTeamIndex; // El otro está eliminado, el actual sigue jugando solo
        } else {
          nextIndex = null; // Ambos han terminado esta partida
        }

        if (nextIndex !== null) {
          setActiveTeamIndex(nextIndex);
          pickQuestionForTeam(nextIndex);
          setGameState("THEME_REVEAL");
          sound.playThemeReveal();
        } else {
          // Ambos equipos han terminado esta partida
          const currentMatchResult = {
            match: matchNumber,
            team0: teams[0].money,
            team1: teams[1].money,
            team0Level: teams[0].level,
            team1Level: teams[1].level
          };
          setMatchHistory(prev => [...prev, currentMatchResult]);
          setGameState("MATCH_SUMMARY");
          sound.playCorrect();
        }
      };

      const handleUseLifeline = (type) => {
        const team = teams[activeTeamIndex];
        if (!team.lifelines[type]) {
          setRebuyType(type);
          setActiveModal("REBUY");
          return;
        }

        setTeams(prev => prev.map((t, idx) => idx === activeTeamIndex ? {
          ...t,
          lifelines: { ...t.lifelines, [type]: false }
        } : t));

        sound.playLifeline();

        if (type === "fifty") {
          const wrong = [0, 1, 2, 3].filter(i => i !== currentQuestion.correct);
          const shuffled = wrong.sort(() => 0.5 - Math.random());
          setEliminatedOptions(shuffled.slice(0, 2));
        } else if (type === "call") {
          setIsTimerRunning(false);
          setLifelineCountdown(30);
          setActiveModal("CALL");
        } else if (type === "public") {
          setIsTimerRunning(false);
          setLifelineCountdown(30);
          setActiveModal("PUBLIC");
        } else if (type === "call2") {
          setIsTimerRunning(false);
          setLifelineCountdown(30);
          setActiveModal("CALL2");
        }
      };

      const handleConfirmRebuy = () => {
        const team = teams[activeTeamIndex];
        const cost = Math.floor(team.money * 0.5);

        if (team.money < 100) {
          alert("Dinero insuficiente para recomprar (mínimo 100 €).");
          setActiveModal(null);
          return;
        }

        setTeams(prev => prev.map((t, idx) => idx === activeTeamIndex ? {
          ...t,
          money: t.money - cost,
          lifelines: { ...t.lifelines, [rebuyType]: true }
        } : t));

                      } else if (isSelected && !isCorrect) {
                        fillClass = "bg-gradient-to-b from-red-600 to-red-800 text-white";
                        borderClass = "linear-gradient(180deg, #fca5a5 0%, #ef4444 100%)";
                      } else {
                        fillClass = "bg-slate-950/60 text-slate-600";
                        borderClass = "#334155";
                      }
                    } else if (isSelected) {
                      fillClass = "bg-gradient-to-b from-amber-500 to-yellow-600 text-slate-950 font-black shadow-lg shadow-amber-500/30";
                      borderClass = "linear-gradient(180deg, #fef08a 0%, #eab308 100%)";
                    }

                    return (
                      <div key={idx} className="relative flex items-center">
                        <div className="hidden sm:block w-3 connector-line"></div>
                        <button
                          disabled={gameState !== "QUESTION" || isEliminated || isAnswerConfirmed}
                          onClick={() => handleSelectOption(idx)}
                          style={{ background: borderClass }}
                          className={`w-full p-[2px] transition-all hover:scale-[1.01] ${
                            isEliminated ? "pointer-events-none opacity-20" : "cursor-pointer"
                          }`}
                        >
                          <div className={`lozenge-shape py-3.5 px-6 flex items-center gap-3 text-left ${fillClass}`}>
                            <span className={`font-black text-sm tracking-wider ${isSelected && gameState === "QUESTION" ? "text-slate-950" : "text-amber-400"}`}>
                              {letter}:
                            </span>
                            <span className="font-semibold text-sm sm:text-base flex-1">
                              {opt}
                            </span>
                            {gameState === "ANSWERED" && isCorrect && (
                              <span className="text-xs font-black uppercase text-white bg-green-900/60 px-2 py-0.5 rounded">
                                Correcta
                              </span>
                            )}
                          </div>
                        </button>
                        <div className="hidden sm:block w-3 connector-line"></div>
                      </div>
                    );
                  })}
                </div>

                {/* BOTÓN CONFIRMAR O PLANTARSE */}
                <div className="pt-2">
                  {gameState === "QUESTION" && (
                    <div className="flex flex-col sm:flex-row items-center gap-3">
                      <button
                        disabled={selectedOption === null || isAnswerConfirmed}
                        onClick={handleConfirmAnswer}
                        className={`flex-1 w-full py-3.5 rounded-lg font-black text-sm uppercase tracking-wider transition ${
                          selectedOption !== null && !isAnswerConfirmed
                            ? "bg-amber-400 hover:bg-amber-300 text-slate-950 cursor-pointer shadow-lg shadow-amber-500/20"
                            : "bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed"
                        }`}
                      >
                        {selectedOption !== null ? "Confirmar Respuesta Definitiva" : "Elige una opción para responder"}
                      </button>

                      {activeTeam.money > 0 && !isAnswerConfirmed && (
                        <button
                          type="button"
                          onClick={handleWalkAway}
                          className="w-full sm:w-auto px-5 py-3.5 rounded-lg bg-amber-500/15 hover:bg-amber-500/30 border border-amber-500/50 text-amber-300 font-black text-xs uppercase tracking-wider transition cursor-pointer"
                          title="Plantarse con el dinero acumulado sin arriesgar a perderlo"
                        >
                          🏳️ Plantarse con {activeTeam.money.toLocaleString("es-ES")} €
                        </button>
                      )}

                      {!isAnswerConfirmed && (
                        <button
                          type="button"
                          onClick={handleEarlyEndMatch}
                          className="w-full sm:w-auto px-4 py-3.5 rounded-lg bg-slate-900/90 hover:bg-slate-800 border border-slate-700 text-slate-400 hover:text-amber-300 font-bold text-xs uppercase tracking-wider transition cursor-pointer"
                          title="Terminar la partida y ver la clasificación y ganador"
                        >
                          🏁 Terminar Partida
                        </button>
                      )}
                    </div>
                  )}

                  {gameState === "ANSWERED" && (
                    <div className="bg-slate-950 border border-slate-700 rounded-xl p-4 sm:p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
                      <div className="text-sm text-left w-full md:w-auto">
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-slate-400 text-xs uppercase font-bold">
                            Resultado para {activeTeam.name}:
                          </span>
                          <span className="text-[10px] text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/30 font-bold">
                            Partida {matchNumber}
                          </span>
                        </div>

                        {activeTeam.status === "WALKED_AWAY" ? (
                          <span className="text-amber-300 font-black text-base block">
                            🏳️ ¡{activeTeam.name} se ha plantado con {activeTeam.money.toLocaleString("es-ES")} €!
                          </span>
                        ) : selectedOption === currentQuestion.correct ? (
                          <div>
                            <span className="text-emerald-400 font-black text-base block">
                              ¡Respuesta Correcta! Premio: {currentPrizeObj.label}
                            </span>
                            {currentPrizeObj.isSafe && (
                              <span className="text-xs text-amber-300 font-bold block mt-0.5">
                                🛡️ ¡Seguro de {currentPrizeObj.label} garantizado para esta partida!
                              </span>
                            )}
                          </div>
                        ) : (
                          <div>
                            <span className="text-red-400 font-black text-base block">
                              ❌ Respuesta Incorrecta • ¡{activeTeam.name} queda eliminado de la Partida {matchNumber}!
                            </span>
                            <span className="text-xs text-slate-300 block mt-0.5">
                              Premio asegurado alcanzado: <strong className="text-amber-300">{activeTeam.safeMoney.toLocaleString("es-ES")} €</strong>
                            </span>
                            {otherTeam.isAlive && (
                              <span className="text-xs text-emerald-400 font-bold block mt-1">
                                👉 {otherTeam.name} continúa jugando ahora en solitario hasta que pierda también.
                              </span>
                            )}
                          </div>
                        )}
                      </div>

                      <button
                        onClick={handleNextTurnOrRound}
                        className="w-full md:w-auto px-6 py-3.5 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider transition shadow-lg shrink-0 cursor-pointer"
                      >
                        {(() => {
                          const isCurrentAlive = activeTeam.isAlive;
                          const isOtherAlive = otherTeam.isAlive;

                          if (isOtherAlive && isCurrentAlive) {
                            return `Continuar: Turno de ${otherTeam.name} (Nivel ${otherTeam.level}) ❯`;
                          }
                          if (isOtherAlive && !isCurrentAlive) {
                            return `Continuar con ${otherTeam.name} en solitario (Nivel ${otherTeam.level}) ❯`;
                          }
                          if (!isOtherAlive && isCurrentAlive) {
                            return `Continuar: Siguiente pregunta para ${activeTeam.name} (Nivel ${activeTeam.level}) ❯`;
                          }
                          // Ambos terminaron
                          return `Finalizar Partida ${matchNumber} • Ver Resultados ❯`;
                        })()}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 5. FIN DE LA PARTIDA (RESUMEN + OPCIONES: TERMINAR PARTIDA O JUGAR SIGUIENTE) */}
            {gameState === "MATCH_SUMMARY" && matchHistory.length > 0 && (() => {
              const lastMatch = matchHistory[matchHistory.length - 1];
              const t0Total = matchHistory.reduce((sum, m) => sum + (m.team0 || 0), 0);
              const t1Total = matchHistory.reduce((sum, m) => sum + (m.team1 || 0), 0);
              const numMatches = matchHistory.length;

              return (
                <div className="bg-slate-950/95 border-2 border-amber-400 rounded-2xl p-6 sm:p-10 max-w-2xl mx-auto w-full text-center shadow-2xl">
                  <div className="inline-block px-3 py-1 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 text-xs font-black uppercase tracking-wider mb-2">
                    Partida {lastMatch.match} Finalizada
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-black text-white tracking-wider uppercase mb-2">
                    Resultados de la Partida {lastMatch.match}
                  </h2>
                  <p className="text-slate-400 text-xs sm:text-sm mb-6 max-w-md mx-auto">
                    Ambos equipos han concluido la <strong>Partida {lastMatch.match}</strong>. Pulsa <strong>&ldquo;Terminar Partida&rdquo;</strong> para proclamar al ganador definitivo o continúa disputando otra ronda (2 o 3 partidas).
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 text-left">
                    {/* Equipo 1 */}
                    <div className="p-4 rounded-xl bg-blue-950/70 border-2 border-blue-500/40 shadow-lg">
                      <div className="flex items-center justify-between text-xs text-blue-300 font-bold mb-1">
                        <span>{teams[0].name}</span>
                        <span className="bg-blue-600 text-white px-1.5 py-0.5 rounded font-black">E1</span>
                      </div>
                      <div className="text-3xl font-black text-white my-1">
                        {lastMatch.team0.toLocaleString("es-ES")} €
                      </div>
                      <div className="text-xs text-slate-300">
                        Nivel alcanzado: <strong>Nivel {lastMatch.team0Level}</strong>
                      </div>
                      <div className="text-[11px] text-slate-400 mt-1">
                        {lastMatch.team0 >= 32000 ? "🛡️ 2º Seguro asegurado (32.000 €)" : lastMatch.team0 >= 1000 ? "🛡️ 1º Seguro asegurado (1.000 €)" : "Sin seguro alcanzado (0 €)"}
                      </div>
                    </div>

                    {/* Equipo 2 */}
                    <div className="p-4 rounded-xl bg-purple-950/70 border-2 border-purple-500/40 shadow-lg">
                      <div className="flex items-center justify-between text-xs text-purple-300 font-bold mb-1">
                        <span>{teams[1].name}</span>
                        <span className="bg-purple-600 text-white px-1.5 py-0.5 rounded font-black">E2</span>
                      </div>
                      <div className="text-3xl font-black text-white my-1">
                        {lastMatch.team1.toLocaleString("es-ES")} €
                      </div>
                      <div className="text-xs text-slate-300">
                        Nivel alcanzado: <strong>Nivel {lastMatch.team1Level}</strong>
                      </div>
                      <div className="text-[11px] text-slate-400 mt-1">
                        {lastMatch.team1 >= 32000 ? "🛡️ 2º Seguro asegurado (32.000 €)" : lastMatch.team1 >= 1000 ? "🛡️ 1º Seguro asegurado (1.000 €)" : "Sin seguro alcanzado (0 €)"}
                      </div>
                    </div>
                  </div>

                  {/* Resumen Acumulado si se han jugado 2 o más partidas */}
                  {numMatches >= 2 && (
                    <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 text-xs text-slate-300 mb-6 text-left">
                      <div className="text-amber-400 font-bold mb-1.5 uppercase tracking-wider text-[11px]">
                        📊 Total Acumulado tras {numMatches} partidas:
                      </div>
                      <div className="grid grid-cols-2 gap-3 text-sm font-black">
                        <div className="p-2.5 rounded bg-blue-950/40 border border-blue-500/30 text-blue-200">
                          <div>{teams[0].name}</div>
                          <div className="text-xl text-amber-300 font-black mt-1">
                            {t0Total.toLocaleString("es-ES")} €
                          </div>
                          <div className="text-[11px] text-slate-400 font-normal">
                            Media: {Math.round(t0Total / numMatches).toLocaleString("es-ES")} €/partida
                          </div>
                        </div>
                        <div className="p-2.5 rounded bg-purple-950/40 border border-purple-500/30 text-purple-200">
                          <div>{teams[1].name}</div>
                          <div className="text-xl text-amber-300 font-black mt-1">
                            {t1Total.toLocaleString("es-ES")} €
                          </div>
                          <div className="text-[11px] text-slate-400 font-normal">
                            Media: {Math.round(t1Total / numMatches).toLocaleString("es-ES")} €/partida
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* BOTÓN TERMINAR PARTIDA Y BOTÓN JUGAR SIGUIENTE PARTIDA */}
                  <div className="space-y-3">
                    <button
                      onClick={handleFinishTournament}
                      className="w-full py-4 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-black text-base uppercase tracking-wider transition shadow-xl shadow-amber-500/20 cursor-pointer"
                    >
                      🏆 Terminar Partida y Ver Ganador
                    </button>

                    {matchNumber < 3 && (
                      <button
                        onClick={handleStartNextMatch}
                        className="w-full py-3.5 rounded-xl bg-blue-900/80 hover:bg-blue-800 border-2 border-blue-400/60 text-white font-black text-sm uppercase tracking-wider transition shadow-lg cursor-pointer"
                      >
                        Jugar Siguiente Partida (Partida {matchNumber + 1}) ➔
                      </button>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* 6. FIN DEL TORNEO (GRAN FINAL TRAS 1, 2, 3 O MÁS PARTIDAS) */}
            {gameState === "FINISHED" && matchHistory.length > 0 && (() => {
              const numMatches = matchHistory.length;
              const t0Total = matchHistory.reduce((sum, m) => sum + (m.team0 || 0), 0);
              const t1Total = matchHistory.reduce((sum, m) => sum + (m.team1 || 0), 0);
              const t0Avg = Math.round(t0Total / numMatches);
              const t1Avg = Math.round(t1Total / numMatches);
              const isT0Winner = t0Total > t1Total;
              const isT1Winner = t1Total > t0Total;
              const winnerName = isT0Winner ? teams[0].name : (isT1Winner ? teams[1].name : null);
              const winnerMoney = Math.max(t0Total, t1Total);
              const winnerAvg = isT0Winner ? t0Avg : (isT1Winner ? t1Avg : t0Avg);

              return (
                <div className="bg-slate-950/95 border-2 border-amber-400 rounded-2xl p-6 sm:p-10 max-w-2xl mx-auto w-full text-center shadow-2xl">
                  <div className="inline-block text-4xl mb-2">🏆</div>
                  <h2 className="text-2xl sm:text-3xl font-black text-amber-400 tracking-wider uppercase">
                    Gran Final del Concurso
                  </h2>
                  <p className="text-slate-300 text-xs sm:text-sm mt-1 mb-6">
                    Clasificación Definitiva tras {numMatches} {numMatches === 1 ? "Partida disputada" : "Partidas disputadas"}
                  </p>

                  {/* TABLA COMPARATIVA DE LAS PARTIDAS */}
                  <div className="overflow-x-auto rounded-xl border border-slate-700 mb-6 shadow-xl">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 border-b border-slate-800 text-slate-400 font-bold uppercase text-[10px]">
                        <tr>
                          <th className="p-3">Equipo</th>
                          {matchHistory.map((m, i) => (
                            <th key={i} className="p-3 text-center">Partida {m.match || (i + 1)}</th>
                          ))}
                          <th className="p-3 text-right text-amber-400">TOTAL ACUMULADO</th>
                          <th className="p-3 text-right">Media</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/80 bg-slate-950/60 font-semibold">
                        <tr className={isT0Winner ? "bg-amber-500/10" : ""}>
                          <td className="p-3 font-bold text-slate-100 flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                            <span>{teams[0].name}</span>
                            {isT0Winner && <span className="text-amber-400 text-xs">👑</span>}
                          </td>
                          {matchHistory.map((m, i) => (
                            <td key={i} className="p-3 text-center text-slate-300">
                              {m.team0.toLocaleString("es-ES")} €
                            </td>
                          ))}
                          <td className="p-3 text-right text-base font-black text-amber-300">
                            {t0Total.toLocaleString("es-ES")} €
                          </td>
                          <td className="p-3 text-right text-slate-400">
                            {t0Avg.toLocaleString("es-ES")} €
                          </td>
                        </tr>
                        <tr className={isT1Winner ? "bg-amber-500/10" : ""}>
                          <td className="p-3 font-bold text-slate-100 flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
                            <span>{teams[1].name}</span>
                            {isT1Winner && <span className="text-amber-400 text-xs">👑</span>}
                          </td>
                          {matchHistory.map((m, i) => (
                            <td key={i} className="p-3 text-center text-slate-300">
                              {m.team1.toLocaleString("es-ES")} €
                            </td>
                          ))}
                          <td className="p-3 text-right text-base font-black text-amber-300">
                            {t1Total.toLocaleString("es-ES")} €
                          </td>
                          <td className="p-3 text-right text-slate-400">
                            {t1Avg.toLocaleString("es-ES")} €
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* ANUNCIO DEL CAMPEÓN */}
                  <div className="p-5 rounded-xl bg-gradient-to-r from-blue-950 via-slate-900 to-purple-950 border-2 border-amber-400 mb-6 shadow-2xl">
                    {winnerName ? (
                      <>
                        <div className="text-xs font-black uppercase tracking-widest text-amber-400 mb-1">
                          ¡EQUIPO GRAN CAMPEÓN ABSOLUTO!
                        </div>
                        <div className="text-2xl sm:text-3xl font-black text-white">
                          🎉 {winnerName} 🎉
                        </div>
                        <div className="text-lg font-black text-amber-300 mt-1">
                          Total Acumulado: {winnerMoney.toLocaleString("es-ES")} €
                        </div>
                        <div className="text-xs text-slate-300 mt-0.5">
                          Media: {winnerAvg.toLocaleString("es-ES")} € por partida ({numMatches} {numMatches === 1 ? "partida" : "partidas"})
                        </div>
                      </>
                    ) : (
                      <>
                        <div className="text-xs font-black uppercase tracking-widest text-amber-400 mb-1">
                          ¡EMPATE TOTAL!
                        </div>
                        <div className="text-2xl font-black text-white">
                          🤝 {teams[0].name} y {teams[1].name} 🤝
                        </div>
                        <div className="text-base font-bold text-amber-300 mt-1">
                          Ambos equipos empatan con {t0Total.toLocaleString("es-ES")} € acumulados
                        </div>
                      </>
                    )}
                  </div>

                  <div className="space-y-3">
                    <button
                      onClick={handleResetTournament}
                      className="w-full py-3.5 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm uppercase tracking-wider transition shadow-lg cursor-pointer"
                    >
                      Jugar Nuevo Torneo
                    </button>
                  </div>
                </div>
              );
            })()}
          </main>

            {/* PANEL LATERAL DE LA ESCALA DE PREMIOS (VISIBLE SIEMPRE EN ESCRITORIO Y TABLET) */}
            <aside className="hidden lg:block w-72 xl:w-80 shrink-0 sticky top-16">
              <PrizeLadderCard
                activeTeamIndex={activeTeamIndex}
                teams={teams}
                matchNumber={matchNumber}
                matchHistory={matchHistory}
                gameState={gameState}
                currentPrizeObj={currentPrizeObj}
                isModal={false}
              />
            </aside>
          </div>

          {/* MODAL COMODÍN LLAMADA */}
          {activeModal === "CALL" && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-slate-950 border-2 border-slate-600 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                <h3 className="text-base font-black text-slate-100 uppercase tracking-wider">Comodín de la Llamada</h3>
                <p className="text-slate-400 text-xs mt-1 mb-4">Llamad a un compañero del grupo por teléfono o altavoz.</p>
                <div className="text-4xl font-mono font-bold text-amber-400 mb-6">
                  00:{lifelineCountdown.toString().padStart(2, "0")}
                </div>
                <button
                  onClick={closeLifelineModal}
                  className="w-full py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-bold uppercase tracking-wider"
                >
                  Finalizar Llamada
                </button>
              </div>
            </div>
          )}

          {/* MODAL COMODÍN PÚBLICO */}
          {activeModal === "PUBLIC" && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-slate-950 border-2 border-slate-600 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                <h3 className="text-base font-black text-slate-100 uppercase tracking-wider">Comodín del Público</h3>
                <p className="text-slate-400 text-xs mt-1 mb-4">El representante puede girarse y consultar con todo su equipo.</p>
                <div className="text-4xl font-mono font-bold text-amber-400 mb-6">
                  00:{lifelineCountdown.toString().padStart(2, "0")}
                </div>
                <button
                  onClick={closeLifelineModal}
                  className="w-full py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-bold uppercase tracking-wider"
                >
                  Finalizar Consulta
                </button>
              </div>
            </div>
          )}

          {/* MODAL COMODÍN LLAMADA 2 */}
          {activeModal === "CALL2" && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-slate-950 border-2 border-slate-600 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                <h3 className="text-base font-black text-slate-100 uppercase tracking-wider">Comodín de la Llamada 2</h3>
                <p className="text-slate-400 text-xs mt-1 mb-4">Llamad a un segundo compañero del grupo por teléfono o altavoz.</p>
                <div className="text-4xl font-mono font-bold text-amber-400 mb-6">
                  00:{lifelineCountdown.toString().padStart(2, "0")}
                </div>
                <button
                  onClick={closeLifelineModal}
                  className="w-full py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-bold uppercase tracking-wider"
                >
                  Finalizar Llamada 2
                </button>
              </div>
            </div>
          )}

          {/* MODAL RECOMPRA (50% DEL DINERO ACUMULADO) */}
          {activeModal === "REBUY" && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-slate-950 border-2 border-amber-400 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                <h3 className="text-base font-black text-slate-100 uppercase tracking-wider">Recomprar Comodín</h3>
                <p className="text-slate-400 text-xs mt-1 mb-4">
                  Cuesta exactamente el 50% de vuestro dinero acumulado actual.
                </p>

                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 text-xs mb-4 text-left space-y-1">
                  <div className="flex justify-between text-slate-400">
                    <span>Dinero actual:</span>
                    <span className="text-slate-100 font-bold">{activeTeam.money.toLocaleString("es-ES")} €</span>
                  </div>
                  <div className="flex justify-between text-amber-400 font-bold">
                    <span>Coste recompra (50%):</span>
                    <span>-{rebuyCost.toLocaleString("es-ES")} €</span>
                  </div>
                  <div className="flex justify-between font-bold text-slate-200 border-t border-slate-800 pt-1">
                    <span>Saldo resultante:</span>
                    <span>{(activeTeam.money - rebuyCost).toLocaleString("es-ES")} €</span>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setActiveModal(null)}
                    className="flex-1 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
                  >
                    Cancelar
                  </button>
                  <button
                    disabled={activeTeam.money < 100}
                    onClick={handleConfirmRebuy}
                    className="flex-1 py-2 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-black disabled:opacity-40"
                  >
                    Confirmar (-{rebuyCost} €)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL ESCALA DE PREMIOS (PIRÁMIDE MÍTICA EN MÓVILES) */}
          {activeModal === "LADDER" && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3 sm:p-4">
              <div className="max-w-sm w-full max-h-[92vh] overflow-y-auto">
                <PrizeLadderCard
                  activeTeamIndex={activeTeamIndex}
                  teams={teams}
                  matchNumber={matchNumber}
                  matchHistory={matchHistory}
                  gameState={gameState}
                  currentPrizeObj={currentPrizeObj}
                  isModal={true}
                  onClose={() => setActiveModal(null)}
                />
              </div>
            </div>
          )}

          {/* MODAL MÓVIL / QR */}
          {activeModal === "QR" && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-slate-950 border-2 border-slate-600 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                <h3 className="text-base font-black text-slate-100 mb-1 uppercase tracking-wider">
                  Jugar desde iPhone
                </h3>
                <p className="text-slate-400 text-xs mb-4">
                  Escanea con la cámara del móvil en la misma red Wi-Fi:
                </p>
                <div className="bg-white p-3 rounded-xl inline-block mb-4 shadow-xl">
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(shareUrl)}`}
                    alt="QR"
                    className="w-40 h-40 block"
                  />
                </div>
                <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-lg flex items-center justify-between text-xs text-slate-300 mb-4">
                  <span className="font-mono truncate">{shareUrl}</span>
                  <button
                    onClick={copyShareLink}
                    className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold ml-2 shrink-0"
                  >
                    {copied ? "Copiado" : "Copiar"}
                  </button>
                </div>
                <button
                  onClick={() => setActiveModal(null)}
                  className="w-full py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold"
                >
                  Cerrar
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="text-center py-2 text-[10px] text-slate-500 border-t border-slate-800/80">
            ¿Quién Quiere Ser Millonario? • Edición 2 Equipos
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
